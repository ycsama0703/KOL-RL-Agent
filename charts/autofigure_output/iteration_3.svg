<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" width="100%" height="100%" style="background-color: #FAFAFA; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;"> <defs> <!-- Shadow Filter for Background Panels --> <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%"> <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/> </filter> <!-- Standard Arrowhead (Gray) --> <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" /> </marker> <!-- Accent Arrowhead (Sequence/Blue) --> <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6" /> </marker> <!-- Accent Arrowhead (Architecture/Purple) --> <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6" /> </marker> <!-- Auxiliary Arrowhead (Architecture Skips/Light Purple) --> <marker id="arrow-skip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa" /> </marker> <!-- Feedback Arrowhead (Backprop/Orange) --> <marker id="arrow-feedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"> <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b" /> </marker> </defs> <!-- Header Title & Subtitle --> <g id="header"> <text x="700" y="55" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">TRANSFORMER TRAINING PIPELINE</text> <text x="700" y="80" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">End-to-end framework from raw data processing to gradient-based parameter optimization</text> </g> <!-- Background Panels --> <g id="panels" filter="url(#shadow)"> <!-- Phase 1: Data Preparation --> <rect x="140" y="110" width="280" height="760" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /> <path d="M 140 126 A 16 16 0 0 1 156 110 L 420 110 L 420 150 L 140 150 Z" fill="#e2e8f0"/> <text x="280" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#334155" letter-spacing="0.5">1. DATA PREPARATION STAGE</text> <!-- Phase 2: Transformer Architecture --> <rect x="540" y="110" width="320" height="760" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2" /> <path d="M 540 126 A 16 16 0 0 1 556 110 L 860 110 L 860 150 L 540 150 Z" fill="#ede9fe"/> <text x="700" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#5b21b6" letter-spacing="0.5">2. TRANSFORMER ARCHITECTURE</text> <!-- Phase 3: Loss & Optimization --> <rect x="980" y="110" width="280" height="760" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2" /> <path d="M 980 126 A 16 16 0 0 1 996 110 L 1260 110 L 1260 150 L 980 150 Z" fill="#ffedd5"/> <text x="1120" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#9a3412" letter-spacing="0.5">3. LOSS &amp; OPTIMIZATION</text> </g> <!-- Logical Group Boundaries --> <g id="grouping-boxes"> <!-- Nx Transformer Blocks --> <rect x="560" y="270" width="280" height="570" rx="12" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8,6" /> <rect x="635" y="828" width="130" height="24" rx="4" fill="#f5f3ff" /> <text x="700" y="844" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Nx Transformer Blocks</text> </g> <!-- Connectors and Flows --> <g id="lines" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"> <!-- Panel 1 Vertical Flow --> <!-- Start perfectly below the italic text blocks to prevent overlap --> <line x1="280" y1="325" x2="280" y2="425" marker-end="url(#arrow)" /> <line x1="280" y1="565" x2="280" y2="665" marker-end="url(#arrow)" /> <!-- Panel 2 Vertical Core Architecture Flow --> <line x1="700" y1="260" x2="700" y2="280" marker-end="url(#arrow-purple)" stroke="#c4b5fd" /> <line x1="700" y1="375" x2="700" y2="395" marker-end="url(#arrow-purple)" stroke="#c4b5fd" /> <line x1="700" y1="495" x2="700" y2="515" marker-end="url(#arrow-purple)" stroke="#c4b5fd" /> <line x1="700" y1="600" x2="700" y2="620" marker-end="url(#arrow-purple)" stroke="#c4b5fd" /> <line x1="700" y1="720" x2="700" y2="740" marker-end="url(#arrow-purple)" stroke="#c4b5fd" /> <!-- Panel 3 Vertical Flow --> <line x1="1120" y1="325" x2="1120" y2="425" marker-end="url(#arrow)" /> <line x1="1120" y1="565" x2="1120" y2="665" marker-end="url(#arrow)" /> <!-- Panel 2 Residual Skip Connections --> <!-- Skips specifically route around the nodes and join at the downward arrows before Add & Norm --> <path d="M 700 385 L 800 385 Q 810 385 810 395 L 810 495 Q 810 505 800 505 L 708 505" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow-skip)" /> <path d="M 700 610 L 800 610 Q 810 610 810 620 L 810 720 Q 810 730 800 730 L 708 730" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow-skip)" /> <!-- Cross-Panel Macro Transitions --> <!-- 1. Sequence Vectors (P1 Embeddings to P2 Pos Encoding) --> <path d="M 390 730 L 470 730 Q 480 730 480 720 L 480 205 Q 480 195 490 195 L 583 195" stroke="#3b82f6" stroke-width="4" marker-end="url(#arrow-accent)" /> <!-- 2. Contextual States (P2 Architecture Output to P3 Logits) --> <path d="M 810 785 L 920 785 Q 930 785 930 775 L 930 250 Q 930 240 940 240 L 1003 240" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow-purple)" /> <!-- Backpropagation Feedback Loop (P3 Optimizer back to Architecture base) --> <path d="M 1120 810 L 1120 880 Q 1120 890 1110 890 L 710 890 Q 700 890 700 880 L 700 858" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arrow-feedback)" /> <!-- Auxiliary Data Injection (Target Labels referencing Ground Truth) --> <line x1="1275" y1="490" x2="1232" y2="490" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" /> </g> <!-- Path Badges and Callouts --> <g id="line-labels"> <!-- Sequence Vectors Badge --> <rect x="435" y="440" width="90" height="26" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.5" /> <text x="480" y="457" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">Sequence Vectors</text> <!-- Contextual States Badge --> <rect x="865" y="520" width="130" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" /> <text x="930" y="537" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">Contextual States</text> <!-- Backprop Feedback Badge --> <rect x="790" y="877" width="240" height="26" rx="6" fill="#FAFAFA" /> <text x="910" y="894" text-anchor="middle" font-size="12" font-weight="700" fill="#d97706" font-style="italic">Gradient Propagation &amp; Weight Updates</text> <!-- Target Data Entity --> <rect x="1275" y="475" width="90" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" /> <text x="1320" y="494" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Target Tokens</text> <text x="1320" y="520" text-anchor="middle" font-size="10" font-weight="400" fill="#94a3b8" font-style="italic">(Ground Truth)</text> </g> <!-- Component Logic Placeholder Nodes --> <g id="placeholders"> <!-- ==================== PANEL 1 ==================== --> <g id="node-raw-text"> <text x="280" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Raw Text Corpus</text> <rect x="170" y="215" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="280" y="250" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="280" dy="-4">[icon]: A database server storing</tspan> <tspan x="280" dy="16">vast amounts of raw text data</tspan> </text> <text x="280" y="310" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">e.g., Wikipedia, Web Crawl</text> </g> <g id="node-bpe"> <text x="280" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">BPE Tokenizer</text> <rect x="170" y="455" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="280" y="490" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="280" dy="-4">[icon]: A gear mechanism slicing a</tspan> <tspan x="280" dy="16">sentence into subword chunks</tspan> </text> <text x="280" y="550" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Output IDs: [102, 54, 891 ...]</text> </g> <g id="node-embeddings"> <text x="280" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Token Embeddings</text> <rect x="170" y="695" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="280" y="730" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="280" dy="-4">[icon]: A glowing matrix showing</tspan> <tspan x="280" dy="16">dense continuous vector space</tspan> </text> <text x="280" y="790" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Lookup mapping integer IDs to vectors</text> </g> <!-- ==================== PANEL 2 ==================== --> <g id="node-pos-encoding"> <text x="700" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Positional Encoding</text> <rect x="590" y="180" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="205" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="-4">[icon]: Intersecting sine and cosine</tspan> <tspan x="700" dy="14">waves indicating sequence order</tspan> </text> <text x="700" y="245" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Injects temporal context into semantics</text> </g> <g id="node-qkv"> <text x="700" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Linear Projections (Q / K / V)</text> <rect x="590" y="295" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="320" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="-4">[icon]: 3 split matrix blocks projecting</tspan> <tspan x="700" dy="14">Query, Key, and Value components</tspan> </text> <text x="700" y="360" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Prepares vector spaces for interaction</text> </g> <g id="node-attention"> <text x="700" y="405" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Masked Multi-Head Self-Attention</text> <rect x="590" y="415" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="440" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="-4">[icon]: Masked network graph preventing</tspan> <tspan x="700" dy="14">forward-looking sequence connections</tspan> </text> <text x="700" y="480" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Enforces causal next-token predictions</text> </g> <g id="node-addnorm-1"> <text x="700" y="525" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Add &amp; Norm</text> <rect x="590" y="535" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="565" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="0">[icon]: Plus sign &amp; normalization gauge</tspan> </text> </g> <g id="node-ffn"> <text x="700" y="630" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Feed Forward Network</text> <rect x="590" y="640" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="665" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="-4">[icon]: A multi-layer perceptron</tspan> <tspan x="700" dy="14">neural network schematic</tspan> </text> <text x="700" y="705" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Non-linear feature projection step</text> </g> <g id="node-addnorm-2"> <text x="700" y="750" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Add &amp; Norm</text> <rect x="590" y="760" width="220" height="50" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="700" y="790" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="700" dy="0">[icon]: Plus sign &amp; normalization gauge</tspan> </text> </g> <!-- ==================== PANEL 3 ==================== --> <g id="node-logits"> <text x="1120" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Output Logits &amp; Softmax</text> <rect x="1010" y="215" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="1120" y="250" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="1120" dy="-4">[icon]: A bell curve projecting</tspan> <tspan x="1120" dy="16">probabilities over vocabulary</tspan> </text> <text x="1120" y="310" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Predicts likelihood array for next token</text> </g> <g id="node-loss"> <text x="1120" y="440" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Cross-Entropy Loss</text> <rect x="1010" y="455" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="1120" y="490" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="1120" dy="-4">[icon]: A bar chart comparing</tspan> <tspan x="1120" dy="16">predictions against actual targets</tspan> </text> <text x="1120" y="550" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Aggregated loss metric quantifying error</text> </g> <g id="node-optimizer"> <text x="1120" y="680" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">Backpropagation &amp; Optimizer</text> <rect x="1010" y="695" width="220" height="70" rx="8" ry="8" style="fill:#cccccc; stroke:#666666; stroke-width:1;" /> <text x="1120" y="730" text-anchor="middle" font-size="11" font-weight="500" fill="#222222"> <tspan x="1120" dy="-4">[icon]: Arrow pointing backwards with</tspan> <tspan x="1120" dy="16">calculus gradient delta symbol</tspan> </text> <text x="1120" y="790" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">Computes gradients using AdamW</text> </g> </g>
</svg>